<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Saqr Boxing Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .checkout-card h2 {
            color: #ff3b30;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #121212;
            color: #fff;
            font-size: 1rem;
        }

        .payment-methods {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .payment-info {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #252525;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #4cd964;
        }

        .btn {
            background-color: #ff3b30;
            color: #fff;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #d32f2f;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <h2>Complete Registration</h2>
        
        <form id="checkoutForm">
            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label>Phone Number (WhatsApp)</label>
                <input type="tel" placeholder="01xxxxxxxxx" required>
            </div>

            <!-- Select Plan -->
            <div class="form-group">
                <label>Selected Plan</label>
                <select id="planSelect">
                    <option value="Basic - 1,500 EGP">Basic Pass (1,500 EGP / 3 Months)</option>
                    <option value="Pro - 2,700 EGP">Pro Fighter (2,700 EGP / 3 Months)</option>
                    <option value="Elite - 4,500 EGP">Elite Champion (4,500 EGP / 3 Months)</option>
                </select>
            </div>

            <!-- Payment Method -->
            <div class="payment-methods">
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="paymentMethod" onchange="togglePaymentInfo()" required>
                        <option value="">-- Choose Payment Method --</option>
                        <option value="vodafone">Vodafone Cash</option>
                        <option value="instapay">InstaPay</option>
                    </select>
                </div>

                <!-- Vodafone Cash Info -->
                <div id="vodafoneInfo" class="payment-info">
                    <strong>Vodafone Cash Number:</strong><br>
                    📱 0100 000 0000<br>
                    <small>* Please send the amount and keep the receipt screenshot.</small>
                </div>

                <!-- InstaPay Info -->
                <div id="instapayInfo" class="payment-info">
                    <strong>InstaPay IPA / Mobile:</strong><br>
                    💳 saqrboxing@instapay / 01000000000<br>
                    <small>* Please transfer the exact amount using InstaPay.</small>
                </div>
            </div>

            <!-- Transaction Reference -->
            <div class="form-group">
                <label>Transfer Reference / Wallet Number</label>
                <input type="text" placeholder="Enter number sent from or Transaction ID" required>
            </div>

            <button type="submit" class="btn">Confirm & Send via WhatsApp</button>
        </form>

        <a href="index.html" class="back-link">← Back to Academy Page</a>
    </div>

    <script>
        function togglePaymentInfo() {
            var method = document.getElementById("paymentMethod").value;
            document.getElementById("vodafoneInfo").style.display = (method === "vodafone") ? "block" : "none";
            document.getElementById("instapayInfo").style.display = (method === "instapay") ? "block" : "none";
        }

        document.getElementById("checkoutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Redirecting to WhatsApp to complete confirmation!");
            // Here you can integrate WhatsApp API link directly
        });
    </script>

</body>
</html>
