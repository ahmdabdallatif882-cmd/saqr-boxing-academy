<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saqr Boxing Academy | أكاديمية صقر للملاكمة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff3b30;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3b30;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
            transition: 0.3s;
        }
        nav a:hover {
            color: #ff3b30;
        }
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?q=80&w=1000') center/cover;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
            color: #fff;
        }
        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #ddd;
        }
        .btn {
            background-color: #ff3b30;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #e02d22;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e1e1e;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- الهيدر والقائمة -->
    <header>
        <div class="logo">🦅 Saqr Boxing Academy</div>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#about">عن الأكاديمية</a>
            <a href="#courses">التمارين</a>
            <a href="#contact">تواصل معنا</a>
        </nav>
    </header>

    <!-- القسم الرئيسي (Hero Section) -->
    <section class="hero">
        <h1>مرحباً بك في أكاديمية صقر للملاكمة</h1>
        <p>تعلم فنون الملاكمة من الصفر وحتى الاحتراف مع أفضل التدريبات والأساسيات.</p>
        <a href="#courses" class="btn">ابدأ التمرين الآن</a>
    </section>

    <!-- الفوتر -->
    <footer>
        <p>&copy; 2026 Saqr Boxing Academy. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
